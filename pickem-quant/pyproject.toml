[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pickem-quant"
version = "0.1.0"
description = "Quantitative pick'em DFS engine: devigged fair probabilities, copula-correlated Monte Carlo, scenario MVO / Kelly portfolio construction, CLV ledger. Model-agnostic."
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
net = ["requests>=2.28"]
dev = ["pytest>=7"]

[project.scripts]
pq = "pickem_quant.cli:main"

[tool.setuptools.packages.find]
include = ["pickem_quant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Monstrosity Bowl</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700&family=Big+Shoulders+Display:wght@700;800;900&display=swap">
<style>
/* Layout: one full-bleed game viewport; scoreboard, lower third, glass controls and sheets all float over the 3D field. Single dark look by design. */
:root {
  --navy: #0a1124; --navy2: #141f44; --ink: #f4f6fb; --dim: #aab5d2; --gold: #ffc42e; --gold2: #ffb300; --mon: #ff8a1f; --ant: #ff4d5e;
  --blue: #4c97ff; --good: #3be38b; --bad: #ff5a5a; --glass: rgba(9, 15, 34, .82); --line: rgba(255, 255, 255, .16);
  --fd: 'Big Shoulders Display', Impact, 'Arial Narrow', sans-serif; --fb: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: radial-gradient(120% 80% at 50% 0%, #1a2a58 0%, #060a17 72%) #060a17; color: var(--ink); font-family: var(--fb); font-size: 16px; line-height: 1.25; padding-inline: 16px; overscroll-behavior: none; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; border: 0; background: none; padding: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#app { height: 100%; min-height: 540px; max-width: 1180px; margin-inline: auto; padding-block: 10px; display: flex; }
#stage { position: relative; flex: 1 1 auto; min-width: 0; border-radius: 22px; overflow: hidden; background: #0c1a12; box-shadow: 0 0 0 1px var(--line), 0 24px 60px rgba(0, 0, 0, .6);
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; isolation: isolate; }
.view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#vig { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(130% 95% at 50% 42%, transparent 52%, rgba(3, 7, 18, .5) 100%); }
#stage::before, #stage::after { content: ""; position: absolute; left: 0; right: 0; height: 9%; background: #03060f; z-index: 3; transition: transform .35s cubic-bezier(.2, .8, .2, 1); pointer-events: none; }
#stage::before { top: 0; transform: translateY(-101%); } #stage::after { bottom: 0; transform: translateY(101%); }
#stage.cine::before, #stage.cine::after { transform: none; }
#stage.ov #sb, #stage.ov #chips, #stage.ov #flagchip, #stage.ov #pad, #stage.ov #ticker, #stage.ov #hint, #stage.ov #tags { visibility: hidden; }
#speed { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .18s; z-index: 2;
  background: repeating-conic-gradient(from 0deg at 50% 62%, rgba(255, 255, 255, 0) 0 3.4deg, rgba(255, 255, 255, .16) 3.4deg 4.2deg);
  -webkit-mask: radial-gradient(circle at 50% 62%, transparent 34%, #000 85%); mask: radial-gradient(circle at 50% 62%, transparent 34%, #000 85%); }
#stage.boost #speed { opacity: 1; }
#stage:has(.sheet:not([hidden])) #ticker, #stage:has(.sheet:not([hidden])) #pad { visibility: hidden; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 3; }
#flash.go { animation: flash .5s ease-out; } @keyframes flash { 0% { opacity: .55; } 100% { opacity: 0; } }

/* scoreboard */
#sb { position: absolute; top: 10px; left: 10px; right: 10px; max-width: 560px; margin-inline: auto; display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 7px; z-index: 5; pointer-events: none; font-family: var(--fd); transition: opacity .3s; }
.plate { position: relative; isolation: isolate; height: 44px; display: flex; align-items: center; min-width: 0; }
.plate::before { content: ""; position: absolute; inset: 0; z-index: -1; transform: skewX(-12deg); border-radius: 7px; background: linear-gradient(180deg, rgba(20, 31, 68, .94), rgba(8, 13, 30, .94)); box-shadow: inset 0 -3px 0 var(--c, var(--gold)), 0 6px 16px rgba(0, 0, 0, .35); }
.tm { gap: 7px; padding: 0 12px; } .t0 { --c: var(--mon); } .t1 { --c: var(--ant); flex-direction: row-reverse; }
.tm .ab { font-weight: 900; font-size: 17px; letter-spacing: .05em; color: var(--c); font-style: italic; }
.tm .sc { font-weight: 900; font-size: 32px; line-height: 1; font-style: italic; font-variant-numeric: tabular-nums; margin-inline-start: auto; text-shadow: 0 2px 0 rgba(0, 0, 0, .35); }
.t1 .sc { margin-inline-start: 0; margin-inline-end: auto; }
.pos { width: 9px; height: 9px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); visibility: hidden; flex: none; } .has .pos { visibility: visible; }
.mid { justify-content: center; padding: 0 12px; }
#qt { font-weight: 800; font-size: 19px; color: var(--gold); font-variant-numeric: tabular-nums; letter-spacing: .03em; white-space: nowrap; }
#menuBtn { pointer-events: auto; width: 44px; height: 44px; border-radius: 12px; background: var(--glass); box-shadow: inset 0 0 0 1px var(--line); font-family: var(--fd); font-weight: 900; font-size: 15px; letter-spacing: .1em; }
#chips { position: absolute; top: 62px; left: 12px; right: 12px; max-width: 556px; margin-inline: auto; display: flex; justify-content: space-between; gap: 8px; z-index: 5; pointer-events: none; }
.chip { font: 700 12px/1 var(--fb); letter-spacing: .09em; text-transform: uppercase; padding: 6px 10px; border-radius: 999px; background: rgba(8, 13, 30, .74); white-space: nowrap; }
.chip:empty { visibility: hidden; } .chip b { color: var(--gold); font-weight: 700; }
#flagchip { position: absolute; top: 92px; left: 50%; transform: translateX(-50%) skewX(-12deg); z-index: 6; background: #ffd400; color: #111; font: 900 15px/1 var(--fd); letter-spacing: .12em; padding: 6px 12px; border-radius: 4px; box-shadow: 0 4px 14px rgba(0, 0, 0, .5); pointer-events: none; }
@media (prefers-reduced-motion: no-preference) { #flagchip { animation: blink .7s steps(2, jump-none) infinite; } @keyframes blink { 50% { opacity: .45; } } }
#hint { position: absolute; top: 96px; left: 14px; right: 14px; text-align: center; font: 600 14px/1.3 var(--fb); letter-spacing: .03em; text-shadow: 0 1px 4px rgba(0, 0, 0, .9); z-index: 4; pointer-events: none; text-wrap: balance; }
#hint b { color: var(--gold); font-weight: 700; }

/* receiver tags */
.tag { position: absolute; left: 0; top: 0; width: 28px; height: 28px; margin: -34px 0 0 -14px; border-radius: 50%; background: var(--navy); box-shadow: 0 0 0 2px var(--gold), 0 4px 10px rgba(0, 0, 0, .5); color: var(--gold);
  font: 900 17px/28px var(--fd); text-align: center; z-index: 4; will-change: transform; }
.tag::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -5px; border: 5px solid transparent; border-top-color: var(--gold); border-bottom: 0; }
.tag.sel { background: var(--gold); color: var(--navy); box-shadow: 0 0 0 2px #fff, 0 0 16px var(--gold); }

/* big-moment banner */
#banner { position: absolute; left: -8%; right: -8%; top: 27%; z-index: 6; pointer-events: none; transform: rotate(-4deg); padding: 10px 0; text-align: center;
  background: linear-gradient(180deg, var(--b, var(--gold)) 0 5px, rgba(8, 13, 30, .92) 5px calc(100% - 5px), var(--b, var(--gold)) calc(100% - 5px)); }
#banner span { display: inline-block; font: italic 900 clamp(38px, 12.5vw, 96px)/1 var(--fd); letter-spacing: .02em; color: #fff; text-shadow: 4px 4px 0 var(--b, var(--gold2)); padding: 0 6%; text-wrap: balance; }
#banner.to { --b: var(--bad); } #banner.good { --b: var(--good); } #banner.flag { --b: #ffd400; } #banner.flag span { color: #ffd400; text-shadow: 4px 4px 0 #000; }
@media (prefers-reduced-motion: no-preference) {
  #banner { animation: wipe .28s cubic-bezier(.2, .8, .2, 1) both; } #banner span { animation: slide .34s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0); } } @keyframes slide { from { transform: translateX(-18%); opacity: 0; } to { transform: none; opacity: 1; } }
  #tick.in { animation: tick .3s cubic-bezier(.2, .8, .2, 1); } @keyframes tick { from { transform: skewX(-12deg) translateY(12px); opacity: 0; } }
}

/* lower third + controls */
#ticker { position: absolute; left: 0; right: 0; bottom: 152px; display: flex; justify-content: center; z-index: 4; pointer-events: none; padding: 0 16px; }
#tick { max-width: 100%; padding: 6px 16px 6px 18px; font: italic 800 17px/1.15 var(--fd); letter-spacing: .04em; background: rgba(8, 13, 30, .84); border-radius: 6px; transform: skewX(-12deg); box-shadow: inset 5px 0 0 var(--gold); text-align: center; text-wrap: balance; }
#tick:empty { display: none; }
#pad { position: absolute; left: 0; right: 0; bottom: 0; height: 146px; padding: 0 16px 14px; display: flex; justify-content: space-between; align-items: flex-end; z-index: 4; pointer-events: none;
  background: linear-gradient(to top, rgba(3, 7, 18, .72), rgba(3, 7, 18, 0)); }
#stick { pointer-events: auto; width: 118px; height: 118px; border-radius: 50%; position: relative; touch-action: none; background: radial-gradient(circle at 50% 38%, rgba(255, 255, 255, .2), rgba(255, 255, 255, .05) 62%);
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .4), inset 0 0 0 9px rgba(8, 13, 30, .22), 0 10px 26px rgba(0, 0, 0, .4); }
#nub { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: linear-gradient(160deg, #fff, #c9d2ea); box-shadow: 0 5px 12px rgba(0, 0, 0, .5), inset 0 -5px 0 rgba(0, 0, 0, .12); pointer-events: none; }
#btns { display: flex; gap: 12px; align-items: flex-end; pointer-events: auto; }
.ab-btn { border-radius: 50%; display: grid; place-content: center; gap: 1px; touch-action: none; font-family: var(--fd); font-weight: 900; text-align: center; transition: transform .05s; }
.ab-btn b { font-size: 26px; line-height: .9; font-weight: 900; } .ab-btn small { font: 700 9.5px/1 var(--fb); letter-spacing: .08em; min-height: 10px; }
#bA { width: 78px; height: 78px; background: linear-gradient(160deg, #ffe07a, var(--gold2)); color: var(--navy); box-shadow: 0 6px 0 #a86f00, 0 14px 24px rgba(0, 0, 0, .45); }
#bB { width: 62px; height: 62px; margin-bottom: 30px; background: rgba(255, 255, 255, .16); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .55), 0 10px 22px rgba(0, 0, 0, .35); }
#bB { position: relative; } #bB::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; background: conic-gradient(var(--gold) calc(var(--sta, 100) * 1%), rgba(255, 255, 255, .14) 0);
  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); }
#bA.dn { transform: translateY(5px); box-shadow: 0 1px 0 #a86f00, 0 6px 14px rgba(0, 0, 0, .45); } #bB.dn { transform: scale(.94); background: rgba(255, 255, 255, .3); }

/* sheets */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 82%; overflow-y: auto; z-index: 7; padding: 14px 14px 16px; border-radius: 20px 20px 0 0;
  background: linear-gradient(180deg, rgba(14, 22, 50, .95), rgba(6, 10, 24, .98)); box-shadow: inset 0 3px 0 var(--gold), 0 -18px 50px rgba(0, 0, 0, .55); }
.sheet > * { max-width: 720px; margin-inline: auto; }
.sheet h2 { margin: 0 auto 10px; font: italic 900 26px/1 var(--fd); letter-spacing: .02em; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.sheet h2 span { font: 600 13px/1 var(--fb); letter-spacing: .08em; color: var(--dim); text-transform: uppercase; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.play { display: grid; grid-template-columns: 62px 1fr; gap: 10px; align-items: center; text-align: left; padding: 7px; border-radius: 13px; min-width: 0; background: rgba(255, 255, 255, .06); box-shadow: inset 0 0 0 1px var(--line); transition: transform .06s, background .1s; }
.play:active { transform: scale(.97); background: rgba(255, 196, 46, .16); }
.play canvas { width: 62px; height: 50px; border-radius: 8px; display: block; }
.play b { display: block; font: italic 800 17px/1.05 var(--fd); letter-spacing: .02em; overflow-wrap: anywhere; }
.play i { display: block; margin-top: 4px; font: 600 11px/1.2 var(--fb); letter-spacing: .07em; color: var(--dim); text-transform: uppercase; }
.play i em { font-style: normal; color: var(--k, var(--gold)); } .play.pass { --k: var(--blue); } .play.def { --k: var(--ant); }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.btn { flex: 1 1 0; min-width: 0; overflow-wrap: anywhere; padding: 11px 10px; border-radius: 11px; background: rgba(255, 255, 255, .08); box-shadow: inset 0 0 0 1px var(--line); font: 700 13px/1.1 var(--fb); letter-spacing: .08em; text-transform: uppercase; text-align: center; transition: transform .06s; }
.btn:active { transform: scale(.97); } .btn[disabled] { opacity: .35; cursor: default; }
.btn.on { box-shadow: inset 0 0 0 2px var(--gold); color: var(--gold); }
.btn.go { background: linear-gradient(160deg, #ffe07a, var(--gold2)); color: var(--navy); box-shadow: 0 5px 0 #a86f00; font: italic 900 22px/1 var(--fd); letter-spacing: .04em; padding: 13px 10px; margin-bottom: 5px; }
#kick { text-align: center; } #kick h2 { justify-content: center; }
#meter { position: relative; height: 30px; border-radius: 8px; background: rgba(0, 0, 0, .5); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
#zone { position: absolute; top: 0; bottom: 0; background: rgba(59, 227, 139, .35); box-shadow: inset 2px 0 0 var(--good), inset -2px 0 0 var(--good); }
#mark { position: absolute; top: 0; bottom: 0; width: 8px; margin-left: -4px; background: #fff; box-shadow: 0 0 12px #fff; border-radius: 3px; }

/* film room: the question sheet (over everything, including the title) and the deck screen inside the overlay */
#quiz { z-index: 9; max-height: 88%; }
.qz-q { font: 500 18px/1.35 var(--fb); margin: 2px auto 12px; text-wrap: pretty; white-space: pre-wrap; overflow-wrap: anywhere; }
.qz-ch { display: grid; gap: 8px; }
.choice { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: center; text-align: left; padding: 9px 12px; border-radius: 12px; background: rgba(255, 255, 255, .07); box-shadow: inset 0 0 0 1px var(--line); font: 500 16px/1.3 var(--fb); min-width: 0; transition: transform .06s; }
.choice:active { transform: scale(.985); } .choice span { overflow-wrap: anywhere; }
.choice b { font: 900 16px/28px var(--fd); width: 28px; height: 28px; border-radius: 50%; background: var(--navy); box-shadow: 0 0 0 2px var(--gold); color: var(--gold); text-align: center; }
.choice.ok { box-shadow: inset 0 0 0 2px var(--good); background: rgba(59, 227, 139, .12); } .choice.ok b { background: var(--good); color: var(--navy); box-shadow: none; }
.choice.no { box-shadow: inset 0 0 0 2px var(--bad); opacity: .75; } .choice[disabled] { cursor: default; } .choice[disabled]:not(.ok):not(.no) { opacity: .45; }
.qz-in { display: flex; gap: 8px; } .qz-in input { flex: 1 1 0; min-width: 0; }
.qz-in input, .box { padding: 11px 12px; border-radius: 11px; border: 0; background: rgba(0, 0, 0, .45); color: var(--ink); font: 500 16px/1.3 var(--fb); box-shadow: inset 0 0 0 1px var(--line); }
input.box { width: 100%; margin-top: 8px; } textarea.box { width: 100%; min-height: 120px; resize: vertical; display: block; }
.qz-hint { margin-top: 10px; color: var(--gold); font-size: 15px; }
.qz-fb { margin-top: 12px; padding: 12px; border-radius: 12px; background: rgba(10, 17, 36, .8); box-shadow: inset 0 0 0 1px var(--line), inset 4px 0 0 var(--k, var(--gold)); }
.qz-fb.ok { --k: var(--good); } .qz-fb.no { --k: var(--bad); }
.qz-fb b { font: italic 900 20px/1 var(--fd); display: block; margin-bottom: 6px; }
.qz-fb p { margin: 6px 0 0; color: var(--dim); font-size: 15px; line-height: 1.35; overflow-wrap: anywhere; }
.fr { --c: var(--gold); display: grid; gap: 5px; text-align: left; padding: 14px 12px 12px; border-radius: 14px; margin-top: 10px; background: rgba(10, 17, 36, .82); box-shadow: inset 0 0 0 1px var(--line), inset 0 5px 0 var(--c); align-content: start; min-width: 0; width: 100%; }
.fr u { text-decoration: none; font: 700 11px/1 var(--fb); letter-spacing: .14em; color: var(--c); } .fr b { font: italic 900 25px/.95 var(--fd); overflow-wrap: anywhere; } .fr small { font: 500 13px/1.2 var(--fb); color: var(--dim); }
.deck { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgba(10, 17, 36, .7); box-shadow: inset 0 0 0 1px var(--line); margin-top: 8px; min-width: 0; }
.deck .sw { width: 44px; height: 26px; border-radius: 999px; background: rgba(255, 255, 255, .14); position: relative; box-shadow: inset 0 0 0 1px var(--line); } .deck .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; }
.deck .sw.on { background: var(--gold); } .deck .sw.on::after { transform: translateX(18px); background: var(--navy); }
.deck b { font: italic 800 17px/1.05 var(--fd); overflow-wrap: anywhere; } .deck small { color: var(--dim); font: 600 12px/1.3 var(--fb); letter-spacing: .05em; text-transform: uppercase; }
.deck .x { font: 700 12px/1 var(--fb); letter-spacing: .08em; color: var(--dim); padding: 10px 8px; }
.stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; } .stat div { text-align: center; padding: 10px 6px; border-radius: 12px; background: rgba(10, 17, 36, .7); box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
.stat b { display: block; font: italic 900 26px/1 var(--fd); color: var(--gold); font-variant-numeric: tabular-nums; } .stat small { font: 600 11px/1.2 var(--fb); letter-spacing: .1em; color: var(--dim); text-transform: uppercase; }
#overlay p.note { font-size: 13.5px; margin-top: 8px; }
.file { position: relative; overflow: hidden; } .file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }

/* overlays: title, pause, scouting, film room, final */
#overlay { position: absolute; inset: 0; z-index: 8; overflow-y: auto; padding: 22px 16px 26px; background: linear-gradient(180deg, rgba(6, 10, 24, .3), rgba(6, 10, 24, .9) 44%); }
#overlay > * { max-width: 640px; margin-inline: auto; }
#overlay h1 { margin: 6px auto 0; text-align: center; font: italic 900 clamp(46px, 15vw, 104px)/.86 var(--fd); letter-spacing: .01em; text-wrap: balance; text-shadow: 0 6px 30px rgba(0, 0, 0, .6); }
#overlay h1 em { display: block; font-style: italic; color: var(--gold); } #overlay h1.sm { font-size: clamp(34px, 10vw, 60px); margin-bottom: 14px; }
#overlay h3 { margin: 18px auto 8px; font: 700 12px/1 var(--fb); letter-spacing: .14em; color: var(--gold); text-transform: uppercase; }
#overlay p { margin: 10px auto 0; color: var(--dim); text-wrap: pretty; } #overlay p.c { text-align: center; color: var(--ink); font-weight: 500; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.card { --c: var(--mon); position: relative; text-align: left; padding: 14px 12px 12px; border-radius: 14px; background: rgba(10, 17, 36, .82); box-shadow: inset 0 0 0 1px var(--line), inset 0 5px 0 var(--c); display: grid; gap: 5px; align-content: start; min-width: 0; }
.card.c1 { --c: var(--ant); } .card.sel { box-shadow: inset 0 0 0 2px var(--gold), inset 0 5px 0 var(--c), 0 0 24px rgba(255, 196, 46, .3); }
.card u { text-decoration: none; font: 700 11px/1 var(--fb); letter-spacing: .14em; color: var(--c); }
.card b { font: italic 900 25px/.95 var(--fd); overflow-wrap: anywhere; } .card small { font: 500 13px/1.2 var(--fb); color: var(--dim); }
.card.sel::after { content: "YOU"; position: absolute; top: 12px; right: 10px; font: 700 10px/1 var(--fb); letter-spacing: .12em; color: var(--navy); background: var(--gold); padding: 4px 6px; border-radius: 5px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; margin-top: 14px; }
td, th { padding: 7px 6px; text-align: center; border-bottom: 1px solid var(--line); font-weight: 600; } th { font: 900 20px/1 var(--fd); font-style: italic; }
td:first-child { text-align: left; color: var(--dim); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
.ros { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 12px; font-size: 15px; background: rgba(10, 17, 36, .7); border-radius: 12px; padding: 12px; }
.ros span:nth-child(3n+1), .ros span:nth-child(3n) { color: var(--dim); font-variant-numeric: tabular-nums; } .ros em { font-style: normal; color: var(--gold); }
ul { margin: 0 auto; padding-left: 20px; display: grid; gap: 7px; } li b { color: var(--gold); font-weight: 700; }
@media (min-width: 760px) { .grid { grid-template-columns: repeat(3, 1fr); } #ticker { bottom: 26px; } #tick { font-size: 20px; } #hint { font-size: 16px; } }
@media (max-height: 620px) { #pad { height: 124px; } #stick { width: 100px; height: 100px; } #bA { width: 68px; height: 68px; } #ticker { bottom: 130px; } }
</style>
<div id="app">
  <div id="stage">
    <canvas id="gl" class="view"></canvas>
    <div id="vig"></div><div id="speed"></div><div id="flash"></div><div id="tags"></div>
